name: CI — FastAPI Test Suite & Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  pytest:
    name: FastAPI Unit & Integration Tests (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: todo-api
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy pydantic pytest httpx pytest-cov python-dotenv psycopg2-binary

      - name: Run Pytest suite with coverage
        working-directory: todo-api
        env:
          DATABASE_URL: "sqlite:///./test.db"
        run: |
          pytest -v --cov=app
